name: Ingest flyover mp4s

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Direct URL to a zip that contains *_D.mp4 files
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monza-optimizer-v1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch zip
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/flyin static/flyovers
          if [ -n "${ZIP_URL:-}" ]; then
            curl -fsSL "$ZIP_URL" -o /tmp/flyovers.zip
          else
            gh release download --repo "${GITHUB_REPOSITORY}" --pattern '*.zip' --dir /tmp/rel || true
            zipfile=$(ls /tmp/rel/*.zip 2>/dev/null | head -1 || true)
            if [ -z "${zipfile}" ]; then
              echo "No zip_url and no release zip found"
              exit 1
            fi
            cp "$zipfile" /tmp/flyovers.zip
          fi
          unzip -o /tmp/flyovers.zip -d /tmp/flyin
          find /tmp/flyin -iname '*_D.mp4' -print
          find /tmp/flyin -iname '*_D.mp4' -exec cp -f {} static/flyovers/ \;
          ls -lh static/flyovers/*_D.mp4 | tail

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/flyovers/*_D.mp4
          if git diff --cached --quiet; then
            echo "No flyover changes"
            exit 0
          fi
          git commit -m "Ingest Blender F1 D flyovers into static/flyovers."
          git push origin monza-optimizer-v1
